[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-embed-agent"
version = "0.1.0"
description = "An agentic AI system that recommends optimal embedding models by reasoning about your corpus, hardware, and privacy needs."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "SmartEmbedAgent contributors" }]
keywords = ["embeddings", "agent", "langchain", "claude", "retrieval", "rag", "pii"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]

dependencies = [
    "psutil>=5.9.0,<6.0.0",
    "pydantic>=2.0.0,<3.0.0",
]

[project.optional-dependencies]
full = [
    "torch>=2.0.0,<3.0.0",
    "transformers>=4.35.0,<5.0.0",
    "tiktoken>=0.5.0,<1.0.0",
    "langchain>=0.1.0,<0.4.0",
    "langchain-anthropic>=0.1.0,<0.4.0",
    "langchain-community>=0.0.10,<0.4.0",
    "duckduckgo-search>=4.0.0,<8.0.0",
    "sentence-transformers>=2.2.0,<4.0.0",
    "anthropic>=0.18.0,<1.0.0",
]
dev = [
    "black>=24.0.0",
    "ruff>=0.3.0",
    "pytest>=7.0.0",
]

[project.scripts]
smart-embed-agent = "main:main"

[project.urls]
Homepage = "https://github.com/your-username/SmartEmbedAgent"
Issues = "https://github.com/your-username/SmartEmbedAgent/issues"

[tool.setuptools]
packages = ["src", "evals"]
py-modules = ["main"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]  # handled by black
