name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install minimal dependencies
        # We deliberately install only the dependencies needed to run the
        # deterministic test paths. The full requirements (torch, transformers,
        # langchain) are large and slow to install in CI; the existing tests
        # are designed to pass against the fallback paths.
        run: |
          pip install --upgrade pip
          pip install psutil

      - name: Run tests
        run: |
          python -m unittest discover tests -v

      - name: Validate sample config
        run: |
          python -m src.config_validator config/sample_config.json
